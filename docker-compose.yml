services:
  postgres:
    image: postgres:16-alpine
    container_name: vultstrike-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vultstrike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vultstrike}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vultstrike-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vultstrike}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vultstrike-redis
    ports:
      - "6380:6379"
    volumes:
      - vultstrike-redis:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  vultstrike-postgres:
  vultstrike-redis:
